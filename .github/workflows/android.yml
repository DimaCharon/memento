name: Android

on:
  push:
    branches: ["main", "arena/**", "feature/**", "release/**"]
    paths-ignore:
      - "apk/**"
      - "screenshots/**"
      - "**/*.md"
  workflow_dispatch:
    inputs:
      publish:
        description: "Записать APK и скриншоты обратно в репозиторий"
        type: boolean
        default: true

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: "8.11.1"

jobs:
  build:
    name: Сборка и проверки
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-read-only: false

      - name: Кэш Robolectric
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('**/build.gradle.kts') }}

      - name: Ключ подписи
        run: |
          if [ ! -f keystore/memento.jks ]; then
            mkdir -p keystore
            keytool -genkeypair -v -keystore keystore/memento.jks \
              -storepass "${MEMENTO_STORE_PASSWORD:-memento-pass}" \
              -keypass "${MEMENTO_KEY_PASSWORD:-memento-pass}" \
              -alias "${MEMENTO_KEY_ALIAS:-memento}" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Memento, OU=Mobile, O=Memento, L=Moscow, C=RU"
            echo "::notice::Создан новый ключ подписи keystore/memento.jks"
          else
            echo "Ключ подписи уже в репозитории"
          fi
        env:
          MEMENTO_STORE_PASSWORD: ${{ secrets.MEMENTO_STORE_PASSWORD }}
          MEMENTO_KEY_PASSWORD: ${{ secrets.MEMENTO_KEY_PASSWORD }}
          MEMENTO_KEY_ALIAS: ${{ secrets.MEMENTO_KEY_ALIAS }}

      - name: Проверка ссылок на ресурсы
        run: python3 tools/check_resources.py

      - name: Юнит-тесты и проверки (логика, разметка, ресурсы)
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace testDebugUnitTest 2>&1 | tee ci-test.log

      - name: Сборка APK (release + safe)
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace assembleRelease assembleSafe 2>&1 | tee ci-build.log

      - name: Проверка структуры APK
        if: hashFiles('tools/verify_apk.py') != ''
        run: |
          set -o pipefail
          APKS=$(find app/build/outputs/apk -name "*.apk" | tr "\n" " ")
          echo "проверяю: $APKS"
          python3 tools/verify_apk.py $APKS 2>&1 | tee ci-verify.log

      - name: Что собралось
        run: |
          echo "--- outputs ---"
          find app/build/outputs -name "*.apk" -printf "%p  %k KB\n" 2>/dev/null || echo "(нет apk)"
          echo "--- screenshots ---"
          ls -l app/build/screenshots 2>/dev/null || echo "(нет скриншотов)"
          echo "--- tests ---"
          find app/build/test-results -name "*.xml" | head -20 || true

      - name: Артефакты сборки
        uses: actions/upload-artifact@v4
        with:
          name: memento-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/safe/*.apk
            app/build/screenshots/**
          if-no-files-found: warn

      - name: Запись APK и скриншотов в репозиторий
        if: hashFiles('app/src/main/java/ru/memento/ui/MainActivity.kt') != ''
        run: |
          set -e
          git config user.name "Memento CI"
          git config user.email "ci@users.noreply.github.com"
          publish() {
            git add -A apk screenshots ci-report.txt ci-failure.log 2>/dev/null || true
            if git diff --cached --quiet; then echo "нечего публиковать"; return 0; fi
            git commit -m "$1" || return 0
            for i in 1 2 3 4 5; do
              git fetch origin "$GITHUB_REF_NAME" --quiet || true
              git rebase FETCH_HEAD --quiet 2>/dev/null || git rebase --abort 2>/dev/null || true
              if git push origin "HEAD:$GITHUB_REF_NAME"; then echo "опубликовано"; return 0; fi
              sleep 6
            done
            echo "::warning::не удалось опубликовать коммит"
            return 0
          }
          mkdir -p apk screenshots
          rm -f apk/*.apk
          if ! ls app/build/outputs/apk/release/*.apk >/dev/null 2>&1; then
            echo "::error::release APK не собран"
            exit 1
          fi
          cp app/build/outputs/apk/release/*.apk apk/
          cp app/build/outputs/apk/safe/*.apk apk/
          if [ -d app/build/screenshots ]; then
            cp app/build/screenshots/*.png screenshots/ 2>/dev/null || true
          fi
          {
            echo "run: $GITHUB_RUN_ID"
            echo "commit: $GITHUB_SHA"
            echo "date: $(date -u)"
            echo "--- apk ---"
            ls -l apk
            echo "--- sha256 ---"
            sha256sum apk/*.apk
            echo "--- screenshots ---"
            ls -l screenshots 2>/dev/null || echo "(нет)"
          } > ci-report.txt
          ls -lh apk
          VN=$(grep -oP 'versionName=\K.*' version.properties | tr -d '\r')
          publish "build: APK ${VN} (${GITHUB_SHA::7}) [skip ci]"

      - name: Записать лог ошибки в репозиторий
        if: failure()
        run: |
          git config user.name "Memento CI"
          git config user.email "ci@users.noreply.github.com"
          publish() {
            git add -A apk screenshots ci-report.txt ci-failure.log 2>/dev/null || true
            if git diff --cached --quiet; then echo "нечего публиковать"; return 0; fi
            git commit -m "$1" || return 0
            for i in 1 2 3 4 5; do
              git fetch origin "$GITHUB_REF_NAME" --quiet || true
              git rebase FETCH_HEAD --quiet 2>/dev/null || git rebase --abort 2>/dev/null || true
              if git push origin "HEAD:$GITHUB_REF_NAME"; then echo "опубликовано"; return 0; fi
              sleep 6
            done
            echo "::warning::не удалось опубликовать коммит"
            return 0
          }
          { echo "run: $GITHUB_RUN_ID step failed"; echo "=== ci-test.log ==="; tail -c 40000 ci-test.log 2>/dev/null; echo; echo "=== ci-build.log ==="; tail -c 40000 ci-build.log 2>/dev/null; echo; echo "=== ci-verify.log ==="; cat ci-verify.log 2>/dev/null; } > ci-failure.log || true
          git add -f ci-failure.log
          publish "ci: лог падения сборки [skip ci]"

      - name: Итог
        run: |
          echo "### Memento" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          ls -lh app/build/outputs/apk/release/*.apk app/build/outputs/apk/safe/*.apk 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || true
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo 'Размеры APK и список файлов выше.' >> "$GITHUB_STEP_SUMMARY"
